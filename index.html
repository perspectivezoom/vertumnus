<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="./src/styles/global.css" />
    <link rel="icon" type="image/png" href="./src/icons/favicon.png" />
    <title>vertumnus</title>

    <!-- Every route serves this same file, so these describe the site rather than the page: a
         crawler runs no JavaScript, and the title the app sets never reaches it. -->
    <meta
      name="description"
      content="Printable posters of what's in season at your local farmers' market. Produce data is specific to your region, with week-level granularity."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vertumnus.fyi/" />
    <meta property="og:title" content="vertumnus" />
    <meta
      property="og:description"
      content="Printable posters of what's in season at your local farmers' market. Produce data is specific to your region, with week-level granularity."
    />
    <meta property="og:image" content="https://vertumnus.fyi/og-sfbay.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A poster of a region's produce seasons, with USDA watercolours either side."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
